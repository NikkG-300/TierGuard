[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tierguard"
version = "0.1.0"
description = "Check a Terraform plan for AWS Free Tier safety BEFORE you run terraform apply."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NikkG-300", email = "nik.jrx@gmail.com" }]
keywords = ["aws", "terraform", "free-tier", "cli", "cost", "students"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tierguard = "tierguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tierguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"